allowBuilds:
  esbuild: false
  sharp: true
overrides:
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.5
  # Next's optional renderer must receive the same security patch as the CLI renderer.
  sharp: '>=0.35.5 <0.36.0'
  source-map-js: '>=1.2.2 <2'
  # drizzle-kit's legacy TS loader otherwise retains a vulnerable esbuild copy.
  '@esbuild-kit/core-utils>esbuild': '^0.25.0'
